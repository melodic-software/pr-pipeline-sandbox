name: probe-required-same-name
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  ci-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Conclude per label
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          case "$LABEL" in
            'good first issue' | question) exit 0 ;;
            'help wanted') sleep 300; exit 1 ;;
            *) exit 1 ;;
          esac
