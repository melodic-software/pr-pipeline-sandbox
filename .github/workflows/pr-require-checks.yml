name: PR Require Checks

# Emits the `ci-status` check the merge-queue and ci-gate rulesets require.
# The fleet's pr-require-checks.yml has the same shape: gate jobs, then one
# `ci-status` aggregate that runs on `!cancelled()` and fails unless every
# gate succeeded. A job that is not a reusable-workflow call reports a check
# run named by its job name alone, so the check context is exactly `ci-status`.
#
# FORCING RED. The gate passes unless a file named `.ci-force-red` exists at
# the repository root of the tested commit: the PR's merge commit on
# `pull_request`, the queued merge commit on `merge_group`. Add the file to a
# PR branch to make `ci-status` fail; delete it to make it pass again. A file
# works on both events; a label does not exist on a merge-group run.
#
# REVIEW GATE. On a pull_request event ci-status also fails while the PR
# carries the human-gated label, when a review-lane hold was lifted by an
# account not on the trusted-actor list, and until both review lanes have
# reviewed the head. These three steps are claude-code-plugins#9361's,
# verbatim; pr-feedback-dispatch.yml's rerun-ci-status job re-runs this job
# when a review finishes.

on:
  pull_request:
    branches: [main]
    # ready_for_review starts the gate a draft skipped; labeled and unlabeled
    # re-read the human-gated label (removing it approves).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # A merge queue tests each queued merge commit through this event alone; a
  # required check that never reports on it leaves the queued PR unmergeable.
  merge_group:
    types: [checks_requested]
  # The pr-merge lane starts a full run of main after it merges a PR, and its
  # post-merge check waits for that run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-force-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail when .ci-force-red exists
        run: |
          if [ -e .ci-force-red ]; then
            echo "::error file=.ci-force-red::.ci-force-red is present; ci-status is forced red."
            exit 1
          fi
          echo ".ci-force-red is absent."

  ci-status:
    needs: [check-force-red]
    # !cancelled(), never a success guard: a failed gate must still run this
    # job so it turns red. A skipped required check reports success.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Up to 15 s of retry sleeps per API read in the review-gate steps; in the
    # merge queue, the verdict reader's listing and FAIL reads on top.
    timeout-minutes: 20
    permissions:
      actions: read # the review lanes' runs and jobs
      contents: read # docs/conventions/work-items.yaml and trusted-actors.json at the base
      issues: read # the PR's labels, comments and label events
      pull-requests: read # the PR and its files
    steps:
      - name: Aggregate lane results
        env:
          FORCE_RED: ${{ needs.check-force-red.result }}
        run: |
          echo "check-force-red: $FORCE_RED"
          [ "$FORCE_RED" = success ]
      # A DRAFT IS NOT REVIEWED. Both review lanes skip a draft, so the
      # review-lane step below skips it too; a draft cannot merge, and the
      # ready_for_review run checks the lanes.
      - name: Note a draft
        if: github.event.pull_request.draft == true
        run: |
          msg="draft: review lanes not required; the ready_for_review run requires them"
          echo "::notice::$msg"
          echo "$msg" >>"$GITHUB_STEP_SUMMARY"
      # A PULL REQUEST CARRYING THE HUMAN-GATED LABEL IS HELD. A review lane or
      # an escalation puts the label on so a person decides; removing it is the
      # approval, and the `unlabeled` event re-runs this job. The label's name
      # is the base commit's docs/conventions/work-items.yaml
      # tracker.config.role_labels.human-gated (default `needs-human`), resolved as pr-merge.yml resolves it, and read
      # at the base so the pull request cannot rename its own hold. Labels are
      # read live, not from the event payload, which a later label event
      # outdates. The reason is the newest review-lane hold comment's text: a
      # `<!-- claude-lane-hold lane=` comment by claude[bot], or by
      # github-actions[bot] when its last non-blank line is the lane's
      # `claude-lane: <lane>` footer. Without one the error names none. An unreadable tracker config or label list fails closed.
      # It outputs the label's name, and `held=false` once the live labels
      # read without it, for the hold-lift step below.
      - name: Fail a pull request carrying the human-gated label
        id: human_gated
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! $BASE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the base commit '$BASE_SHA' is not a commit SHA."
            exit 1
          fi
          for attempt in 1 2 3; do
            if tracker=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/docs/conventions/work-items.yaml?ref=$BASE_SHA" 2>"$RUNNER_TEMP/tracker.err"); then
              break
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/tracker.err"; then
              tracker=
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::could not read docs/conventions/work-items.yaml at $BASE_SHA; re-run this run."; exit 1; }
            sleep $((attempt * 5))
          done
          human_gated=needs-human
          if [ -n "$tracker" ]; then
            # The binding is the `tracker` mapping; `null` when the file binds none.
            tracker=$(yq -o=json -I=0 '.tracker' <<<"$tracker") || {
              echo "::error::cannot parse docs/conventions/work-items.yaml at $BASE_SHA"
              exit 1
            }
            human_gated=$(jq -er '[objects | .config | objects | .role_labels | objects
              | .["human-gated"] | strings | gsub("^\\s+|\\s+$"; "")][0] // ""
              | if . == "" then "needs-human" else . end' <<<"$tracker") || {
              echo "::error::cannot read the human-gated role label from docs/conventions/work-items.yaml at $BASE_SHA"
              exit 1
            }
          fi
          echo "label=$human_gated" >>"$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" --paginate --jq '.[].name'); then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::could not read the labels of #$PR_NUMBER; re-run this run."; exit 1; }
            sleep $((attempt * 5))
          done
          if ! grep -qxF -- "$human_gated" <<<"$labels"; then
            echo "held=false" >>"$GITHUB_OUTPUT"
            echo "#$PR_NUMBER carries no '$human_gated' label."
            exit 0
          fi
          reason=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | test("(^|\n)<!-- claude-lane-hold lane="))
              and (.user.login == "claude[bot]" or (.user.login == "github-actions[bot]"
                and ([.body | splits("\r?\n") | gsub("^\\s+|\\s+$"; "") | select(. != "")] | last // ""
                  | test("^\u0060?claude-lane: (claude-review|claude-security-review)\u0060?$")))))
              | .body | @json' | tail -n 1 |
            jq -r '[splits("[\r\n]+") | gsub("^\\s+|\\s+$"; "")
              | select(. != "" and (test("^<!--|^\u0060?claude-lane: ") | not))] | join(" ") | .[0:300]') || reason=
          why=
          [ -z "$reason" ] || why=" (${reason//%/%25})"
          echo "::error::#$PR_NUMBER carries '$human_gated'$why. Removing the label approves this pull request; ci-status re-runs on the unlabel."
          exit 1
      # ONLY A TRUSTED PERSON LIFTS A REVIEW-LANE HOLD. Removing the human-gated
      # label approves a pull request, so once a review lane has held it (a
      # hold comment as the step above reads them), the first removal of the
      # label after the newest hold comment must be by a `human` of the base
      # commit's .github/standards/trusted-actors/trusted-actors.json. A later
      # removal is of a later label, such as an escalation clear-escalations
      # lifts. A bot or another account lifting the hold, or no recorded
      # removal, fails; adding the label back and having a trusted person
      # remove it approves: a trusted person's `labeled` event after the hold
      # starts a new hold that only that list's removal lifts.
      # It runs only when the step above read the live labels and found the
      # label off. A hold is the newest hold comment or the newest `labeled`
      # event of the label by github-actions[bot] or claude[bot], whichever is
      # later: an event cannot be deleted or edited, so removing the comment
      # does not remove the hold, and a review re-run that labels the same head
      # again starts a new hold. Unreadable comments, events or actor list fail
      # closed.
      - name: Fail a review-lane hold an untrusted account lifted
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.human_gated.outputs.held == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HUMAN_GATED: ${{ steps.human_gated.outputs.label }}
        run: |
          if [[ ! $BASE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the base commit '$BASE_SHA' is not a commit SHA."
            exit 1
          fi
          # shellcheck disable=SC2016 # the $ in the --jq filter is a regex anchor
          for attempt in 1 2 3; do
            if held_at=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate \
              --jq '.[] | select(.user.type == "Bot" and (.body | test("(^|\n)<!-- claude-lane-hold lane="))
                and (.user.login == "claude[bot]" or (.user.login == "github-actions[bot]"
                  and ([.body | splits("\r?\n") | gsub("^\\s+|\\s+$"; "") | select(. != "")] | last // ""
                    | test("^`?claude-lane: (claude-review|claude-security-review)`?$")))))
                | .created_at'); then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::could not read the comments of #$PR_NUMBER; re-run this run."; exit 1; }
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if events=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events?per_page=100" --paginate); then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::could not read the events of #$PR_NUMBER; re-run this run."; exit 1; }
            sleep $((attempt * 5))
          done
          labeled_at=$(jq -rs --arg label "$HUMAN_GATED" '[add[] | select(.event == "labeled" and .label.name == $label
            and (.actor.login == "github-actions[bot]" or .actor.login == "claude[bot]")) | .created_at] | max // empty' <<<"$events") || {
            echo "::error::cannot read the events of #$PR_NUMBER."
            exit 1
          }
          held_at=$(printf '%s\n%s\n' "$held_at" "$labeled_at" | sort | tail -n 1)
          if [ -z "$held_at" ]; then
            echo "No review lane has held #$PR_NUMBER."
            exit 0
          fi
          for attempt in 1 2 3; do
            if actors=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.github/standards/trusted-actors/trusted-actors.json?ref=$BASE_SHA"); then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::could not read the trusted-actor list at $BASE_SHA; re-run this run."; exit 1; }
            sleep $((attempt * 5))
          done
          humans=$(jq -er '[.actors[] | select(.kind == "human") | .id | numbers | tostring] | select(length > 0) | join(" ")' <<<"$actors") || {
            echo "::error::the trusted-actor list at $BASE_SHA names no person."
            exit 1
          }
          # A trusted person adding the label back starts a new hold that person's
          # removal lifts, so a hold an untrusted account lifted can be recovered.
          lifted=$(jq -rs --arg label "$HUMAN_GATED" --arg held_at "$held_at" --arg humans " $humans " '[add[]
            | select(.label.name == $label)] as $events
            | ([$held_at, ($events[] | select(.event == "labeled" and .created_at > $held_at
                and (.actor.id as $id | $humans | contains(" \($id) "))) | .created_at)] | max) as $since
            | [$events[] | select(.event == "unlabeled" and .created_at > $since)]
            | min_by(.created_at) // empty | [.created_at, (.actor.id // 0 | tostring), (.actor.login // "an unknown account")] | @tsv' <<<"$events") || {
            echo "::error::cannot read the events of #$PR_NUMBER."
            exit 1
          }
          IFS=$'\t' read -r lifted_at actor_id actor_login <<<"$lifted"
          if [ -z "$lifted_at" ]; then
            echo "::error::a review lane held #$PR_NUMBER at $held_at, and no removal of '$HUMAN_GATED' since then is recorded. Add the label back; a person on the trusted-actor list removing it approves this pull request."
            exit 1
          fi
          if [[ " $humans " != *" $actor_id "* ]]; then
            echo "::error::$actor_login removed '$HUMAN_GATED' from #$PR_NUMBER after a review lane held it, and is not a person on the trusted-actor list. Add the label back; a person on that list removing it approves this pull request."
            exit 1
          fi
          echo "$actor_login, a person on the trusted-actor list, lifted the review-lane hold on #$PR_NUMBER."
      # BOTH REVIEW LANES REVIEW THE HEAD. Neither review check is required by a
      # ruleset (github-iac ADR 0017); this step makes ci-status need them. For
      # each lane it takes the newest pull_request run of the lane's caller
      # workflow on the head and that run's latest jobs, which are the GitHub
      # Actions check runs. The lane passes when its status job succeeded and
      # its `Apply the hold` step succeeded, so a summary-mode run or one
      # without a hold label never counts. A pending, failed or cancelled
      # review fails, as does a skipped one (a fork, or a bot outside the
      # caller's allowed-bot-sender-ids), with the cause named. A lane the
      # kill switch stopped passes: its kill-switch job succeeded and ran its
      # `Report the kill switch` step. A kill-switch job that failed stopped
      # the review too, and fails. Dependabot, the release App and the
      # standards-sync App, by numeric author id, are exempt: no review lane
      # reviews them. An exempt author's PR still fails when a changed file
      # (or a renamed file's old path) matches the callers' hold-paths, since
      # no lane is there to hold it as trust-gate; a person merges it. A draft is exempt
      # (see `Note a draft`). pr-feedback-dispatch.yml re-runs this job when a
      # review run completes. An unreadable run or job list fails closed.
      - name: Require both review lanes on this head
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # dependabot[bot], melodic-release[bot] and
          # melodic-standards-sync[bot], as
          # .github/standards/trusted-actors/trusted-actors.json lists them.
          exempt_author_ids='49699333 337859524 300666570'
          lanes='pr-review-hosted.yml pr-review / review-status
          pr-review-security-hosted.yml pr-review-security / review-status'
          if [[ ! $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the head '$HEAD_SHA' is not a commit SHA."
            exit 1
          fi
          read_api() {
            local attempt body
            for attempt in 1 2 3; do
              if body=$(gh api "$2"); then
                printf '%s\n' "$body"
                return 0
              fi
              [ "$attempt" -lt 3 ] || { echo "::error::could not read $1; re-run this run." >&2; return 1; }
              sleep $((attempt * 5))
            done
          }
          if [[ $AUTHOR_ID =~ ^[0-9]+$ && " $exempt_author_ids " == *" $AUTHOR_ID "* ]]; then
            # The callers' hold-paths, as bash patterns (`*` crosses `/`).
            hold_patterns=('.github/standards/trusted-actors/*' '.github/actions/check-trusted-trigger/*' 'CODEOWNERS' '*/CODEOWNERS' '.gitmodules' '*/.gitmodules')
            if [[ ! $PR_NUMBER =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::the pull request number '$PR_NUMBER' is not a number."
              exit 1
            fi
            pr=$(read_api "#$PR_NUMBER" "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER") || exit 1
            for attempt in 1 2 3; do
              if files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[] | [.filename, (.previous_filename // "")] | @tsv'); then
                break
              fi
              [ "$attempt" -lt 3 ] || { echo "::error::could not read the files of #$PR_NUMBER; re-run this run."; exit 1; }
              sleep $((attempt * 5))
            done
            if [ "$(grep -c . <<<"$files")" -lt "$(jq '.changed_files // 0' <<<"$pr")" ]; then
              echo "::error::GitHub listed fewer files than #$PR_NUMBER changes, so its hold-paths cannot be checked; a person merges it."
              exit 1
            fi
            held=
            while IFS= read -r path; do
              for pattern in "${hold_patterns[@]}"; do
                # shellcheck disable=SC2053 # the pattern is matched as a glob on purpose
                [[ $path != $pattern ]] || held="$held $path"
              done
            done < <(tr '\t' '\n' <<<"$files" | grep .)
            if [ -n "$held" ]; then
              echo "::error::#$PR_NUMBER is by an author no review lane reviews and changes trust-gate paths:${held//%/%25}. A person merges it."
              exit 1
            fi
            echo "The author ($AUTHOR_ID) is one no review lane reviews, and no trust-gate path changed; the review lanes are not required."
            exit 0
          fi
          failed=0
          while read -r file check; do
            runs=$(read_api "the $file runs on $HEAD_SHA" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100") || exit 1
            run=$(jq -c --arg path ".github/workflows/$file" --arg sha "$HEAD_SHA" \
              '[.workflow_runs[] | select(.path == $path and .head_sha == $sha and .event == "pull_request")] | max_by(.id) // empty' <<<"$runs")
            if [ -z "$run" ]; then
              echo "::error::'$check' is missing: no $file run on $HEAD_SHA yet. ci-status re-runs when the review finishes."
              failed=1
              continue
            fi
            id=$(jq -r .id <<<"$run")
            url=$(jq -r .html_url <<<"$run")
            jobs=$(read_api "the jobs of run $id" "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100") || exit 1
            verdict=$(jq -r --arg check "$check" --arg run_status "$(jq -r .status <<<"$run")" '
              (.jobs | map(select(.name == $check)) | max_by(.id)) as $s
              | (.jobs | map(select(.name == "kill-switch")) | max_by(.id)) as $k
              | if $s != null and $s.status != "completed" then "pending"
                elif $s.conclusion == "success" then
                  if any($s.steps[]?; .name == "Apply the hold" and .conclusion == "success") then "pass" else "uncounted" end
                elif $s != null and $s.conclusion != "skipped" then "red \($s.conclusion)"
                elif $k.conclusion == "success" and any($k.steps[]?; .name == "Report the kill switch" and .conclusion == "success") then "stopped"
                elif $run_status != "completed" then "pending"
                else "missing \($k.conclusion // "absent")" end' <<<"$jobs")
            case $verdict in
            pass) echo "'$check' passed on $HEAD_SHA ($url)." ;;
            stopped) echo "::notice::a kill switch stopped '$check' on $HEAD_SHA ($url); the lane is not required." ;;
            pending)
              echo "::error::'$check' has not finished on $HEAD_SHA ($url). ci-status re-runs when the review finishes."
              failed=1
              ;;
            uncounted)
              echo "::error::'$check' passed in $url, but its 'Apply the hold' step did not run: the lane ran in summary mode or without a hold label, so it is not a review that counts."
              failed=1
              ;;
            red\ *)
              echo "::error::'$check' ended ${verdict#red } on $HEAD_SHA ($url): the review did not complete. Re-run the lane."
              failed=1
              ;;
            *)
              echo "::error::'$check' did not run on $HEAD_SHA ($url; kill-switch job: ${verdict#missing }): a fork, or a bot outside the caller's allowed-bot-sender-ids, gets no review, and a kill-switch job that did not succeed stops it. A push by a person on the trusted-actor list starts a review."
              failed=1
              ;;
            esac
          done <<<"$lanes"
          exit "$failed"
      # THE QUEUE RE-CHECKS WHAT THE ARM JUDGED, AT THE HEAD IT MERGES. pr-merge's
      # enable-auto-merge arms a lanes App pull request on one head, and a later
      # push by the lanes App or anyone with write access leaves the arm on, so
      # the queue could merge a head the arm never judged. For a lanes App pull
      # request in a merge group, the last step below therefore holds (each
      # lifted by an approving review of the head by a person on the
      # trusted-actor list):
      # - a head the lanes App's newest pin comment does not name, or an edited
      #   pin (merge-holds.mjs pinHold); with no pin nothing holds;
      # - no pr-verify PASS or PASS-NOTES at the head from a completed,
      #   successful pr-verify.yml run on main (verdictHold);
      # - a FAIL the verdict reader counts, or a reader report that does not read
      #   (evidenceHold), and a pass whose issue link changed (linkHold).
      # merge-holds.mjs also applies its member veto, cost-path and trusted-actor
      # list holds there; hold paths stay off while pr-pipeline.yaml's
      # merge.diff-check.path-holds is unset.
      # Every other author's pull request exits at the author test: nothing
      # holds an owner-queued, standards-sync or dependency pull request. A
      # missing or unreadable input, the base config or the author read
      # included, fails the group closed for every author, so re-run it.
      # All of these steps are merge_group only; a pull_request run reads none
      # of it. A gh api read goes through gh_read, which sends it at most three
      # times; a read that still fails fails this job.
      - name: Write the rate-limit-aware read helper
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        env:
          GH_READ_JOB_SECONDS: 1200
          GH_READ_MARGIN_SECONDS: 375
        run: |
          gh_read() {
            local pool=core deadline err out now until wait at attempt=1 waited=
            ! declare -F api_budget_pool >/dev/null || pool=$(api_budget_pool api "$@")
            deadline=$(cat "$RUNNER_TEMP/gh-read.deadline")
            err=$(mktemp)
            while :; do
              if out=$(gh api "$@" 2>"$err"); then
                cat "$err" >&2
                rm -f "$err"
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              cat "$err" >&2
              until=
              ! declare -F api_budget_stop_until >/dev/null || until=$(api_budget_stop_until "$pool")
              # A 4xx that is no rate limit (404, 422, a 403 the token lacks)
              # answers every send the same, so it is not sent again.
              if grep -qE '(^|[^0-9])HTTP 4[0-9]{2}([^0-9]|$)' "$err" &&
                ! grep -qiE 'rate limit|RATE_LIMITED|abuse detection|HTTP 429' "$err"; then
                rm -f "$err"
                return 1
              fi
              if [ "$attempt" -ge 3 ]; then
                if [[ $until =~ ^[0-9]+$ ]] && ! api_budget_guessed "$until"; then
                  at=$(jq -rn --argjson t "$until" '$t | todate')
                  echo "::error::GitHub's $pool API rate limit blocks 'gh api $*' until $at, and this read has made its 3 sends; a re-run after $at is needed." >&9
                fi
                rm -f "$err"
                return 1
              fi
              attempt=$((attempt + 1))
              now=$(date +%s)
              if [ -z "$until" ]; then
                # No rate limit: full jitter, capped at 5 s, then 10 s.
                wait=$((RANDOM % ((5 << (attempt - 2)) + 1)))
                if [ $((now + wait)) -gt "$deadline" ]; then
                  rm -f "$err"
                  return 1
                fi
                sleep "$wait"
                continue
              fi
              # A guessed stop (no header gave its time) gets no wait, and a
              # second rate limit after the wait none either.
              if [ -n "$waited" ] || ! [[ $until =~ ^[0-9]+$ ]] || api_budget_guessed "$until"; then
                rm -f "$err"
                return 1
              fi
              wait=$((until - now + 1))
              if [ $((now + wait)) -gt "$deadline" ]; then
                at=$(jq -rn --argjson t "$until" '$t | todate')
                echo "::error::GitHub's $pool API rate limit blocks 'gh api $*' until $at, past the $(jq -rn --argjson t "$deadline" '$t | todate') ci-status can wait to inside its timeout; a re-run after $at is needed." >&9
                rm -f "$err"
                return 1
              fi
              echo "::notice::'gh api $*' is rate limited ($pool); waiting ${wait}s for the reset, then reading again." >&9
              sleep "$wait"
              waited=1
            done
          }
          pr_read() {
            local file out
            file=$(pr_read_file "$@") || file=
            if [ -n "$file" ] && [ -f "$file" ]; then
              cat "$file"
              return 0
            fi
            out=$(gh_read "$@") || return 1
            [ -z "$file" ] || pr_read_put "$out" "$@"
            [ -z "$out" ] || printf '%s\n' "$out"
          }
          pr_read_file() {
            local dir=${RUNNER_TEMP:-}/pr-reads
            if [ -z "${RUNNER_TEMP:-}" ] || ! mkdir -p "$dir" 2>/dev/null; then
              return 1
            fi
            printf '%s/%s\n' "$dir" "$(printf '%s\0' "$@" | sha256sum | cut -c1-40)"
          }
          pr_read_put() {
            local out=$1 file
            shift
            file=$(pr_read_file "$@") || return 0
            if ! { [ -z "$out" ] || printf '%s\n' "$out"; } >"$file.$$" 2>/dev/null || ! mv -f "$file.$$" "$file" 2>/dev/null; then
              rm -f "$file.$$"
            fi
            return 0
          }
          echo $(($(date +%s) + GH_READ_JOB_SECONDS - GH_READ_MARGIN_SECONDS)) >"$RUNNER_TEMP/gh-read.deadline"
          { echo 'exec 9>&2'; declare -f gh_read pr_read pr_read_file pr_read_put; } >"$RUNNER_TEMP/gh-read.sh"
      - name: Resolve main's tip
        id: tip
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      # main's Node pin and verdict reader, with no pull request code and no kept
      # credential.
      - name: Check out main's Node pin and verdict reader
        if: ${{ !cancelled() && github.event_name == 'merge_group' && steps.tip.outputs.sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.node-version
            /.github/actions/setup-pinned-node/
            /.github/actions/log-api-budget/rate-limits.json
            /plugins/source-control/skills/babysit-prs/scripts/*.py
            /plugins/source-control/skills/babysit-prs/scripts/verify-legacy-fails.json
            /plugins/source-control/lib/parse-concern-value.sh
            /plugins/source-control/lib/yaml-subset.awk
          sparse-checkout-cone-mode: false
      - name: Set up Node
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version
      # The hold rules and config at the group's base commit, so the queued
      # change cannot rewrite its own hold. A failed checkout leaves
      # BASE_CONFIG empty, which the step below fails closed on.
      - name: Check out the base commit's hold config
        id: base_config
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: base-config
          persist-credentials: false
          sparse-checkout: |
            /docs/conventions/pr-pipeline.yaml
            /docs/conventions/source-control.yaml
            /docs/conventions/work-items.yaml
            /.github/standards/trusted-actors/trusted-actors.json
            /.github/scripts/pr-merge/merge-holds.mjs
          sparse-checkout-cone-mode: false
      - name: Fail a queued lanes App pull request on its pin, verifier or veto
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          VERIFY_EVIDENCE_SCRIPT: .base/plugins/source-control/skills/babysit-prs/scripts/babysit_verify_evidence.py
          ACTIONS_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          BABYSIT_CONFIG_CHECKOUT: ${{ steps.base_config.outcome == 'success' && format('{0}/base-config', github.workspace) || '' }}
          BABYSIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BABYSIT_VERIFY_PULL: ${{ runner.temp }}/lanes-pull.json
          API_BUDGET_TOKEN: github-token
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BASE_CONFIG: ${{ steps.base_config.outcome == 'success' && format('{0}/base-config', github.workspace) || '' }}
        run: |
          . "$RUNNER_TEMP/gh-read.sh"
          if [[ ! ${LANES_APP_ID:-} =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the job's LANES_APP_ID is not a numeric id."
            exit 1
          fi
          # A stale or mistyped variable would read the lanes App's pull request
          # as another author's and skip every hold here.
          if [ ! -d "${BASE_CONFIG:-}" ] ||
            ! identity=$(yq -er '.merge."agent-identity"' "$BASE_CONFIG/docs/conventions/pr-pipeline.yaml") ||
            ! want=$(jq -er --arg login "$identity" '[.actors[] | select(.login == $login) | .id | numbers]
              | if length == 1 then .[0] else error("not one entry") end' "$BASE_CONFIG/.github/standards/trusted-actors/trusted-actors.json"); then
            echo "::error::cannot read merge.agent-identity's trusted-actor id from the hold config at the group's base commit; re-run this run."
            exit 1
          fi
          if [ "$want" != "$LANES_APP_ID" ]; then
            echo "::error::the job's LANES_APP_ID ($LANES_APP_ID, the AUTOMATION_LANES_APP_SENDER_ID variable) is not $identity's trusted-actor id ($want); correct the variable."
            exit 1
          fi
          pr=$(sed -nE 's#^(refs/heads/)?gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]{40}$#\2#p' <<<"$GITHUB_REF")
          if [ -z "$pr" ]; then
            echo "::error::cannot read a pull request number from the merge-group ref '$GITHUB_REF'."
            exit 1
          fi
          if [[ ! $pr =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the pull request number '${pr//%/%25}' is not a number."
            exit 1
          fi
          read_api() {
            local body
            body=$("${READER:-gh_read}" "${@:2}") || { echo "::error::could not read $1; re-run this run." >&2; return 1; }
            printf '%s\n' "$body"
          }
          pull=$(READER=pr_read read_api "#$pr" "repos/$GITHUB_REPOSITORY/pulls/$pr") || exit 1
          if ! jq -e '(.user.id | numbers) and (.user.type | strings)' <<<"$pull" >/dev/null; then
            echo "::error::the author of #$pr could not be read."
            exit 1
          fi
          if ! jq -e --argjson id "$LANES_APP_ID" '.user.id == $id and .user.type == "Bot"' <<<"$pull" >/dev/null; then
            echo "#$pr is not the lanes App's; pr-merge's gate or a person reads its holds."
            exit 0
          fi
          printf '%s\n' "$pull" >"$RUNNER_TEMP/lanes-pull.json"
          BASE_SHA=$GROUP_BASE_SHA
          if [[ ! $BASE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the base commit '$BASE_SHA' is not a commit SHA."
            exit 1
          fi
          # The module, pr-pipeline.yaml and the trusted-actor list come from the
          # hold config checkout: no contents read. A file missing there fails
          # closed.
          for file in .github/scripts/pr-merge/merge-holds.mjs docs/conventions/pr-pipeline.yaml .github/standards/trusted-actors/trusted-actors.json; do
            if [ ! -s "$BASE_CONFIG/$file" ] || ! cp "$BASE_CONFIG/$file" "$RUNNER_TEMP/${file##*/}"; then
              echo "::error::could not read $file in the hold config at the group's base commit; re-run this run."
              exit 1
            fi
          done
          jq -r '.body // ""' <<<"$pull" >"$RUNNER_TEMP/pr-body.txt"
          config=docs/conventions/pr-pipeline.yaml
          yq -o=json '.merge."diff-check"."denied-paths" // []' "$RUNNER_TEMP/pr-pipeline.yaml" >"$RUNNER_TEMP/denied-paths.json" || {
            echo "::error::cannot read merge.diff-check.denied-paths from $config in the hold config."
            exit 1
          }
          # merge.diff-check.path-holds in the hold config: absent or false
          # turns the hold paths off (merge-holds.mjs pathHoldsOf).
          PATH_HOLDS=$(yq '.merge."diff-check"."path-holds" // false' "$RUNNER_TEMP/pr-pipeline.yaml") || {
            echo "::error::cannot read merge.diff-check.path-holds from $config in the hold config."
            exit 1
          }
          export PATH_HOLDS
          : >"$RUNNER_TEMP/files.jsonl"
          read_api "the files of #$pr" "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" --paginate \
            --jq '.[] | [.filename, .previous_filename, .status] | @json' >"$RUNNER_TEMP/files.jsonl" || exit 1
          changed=$(jq -er '.changed_files | numbers' <<<"$pull") || { echo "::error::the changed-file count of #$pr could not be read."; exit 1; }
          if [ "$(grep -c . "$RUNNER_TEMP/files.jsonl")" -lt "$changed" ]; then
            echo "::error::GitHub listed fewer files than #$pr changes, so its hold paths cannot be checked; a person merges it."
            exit 1
          fi
          head=$(jq -r '.head.sha' <<<"$pull")
          if [[ ! $head =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the head of #$pr could not be read."
            exit 1
          fi
          : >"$RUNNER_TEMP/discussion.jsonl"
          for kind in "issues/$pr/comments" "pulls/$pr/reviews" "pulls/$pr/comments"; do
            raw=$(read_api "the $kind of #$pr" "repos/$GITHUB_REPOSITORY/$kind?per_page=100" --paginate) || exit 1
            rows=$(jq -c '.[]' <<<"$raw") || { echo "::error::the $kind of #$pr do not parse."; exit 1; }
            [ -z "$rows" ] || printf '%s\n' "$rows" >>"$RUNNER_TEMP/discussion.jsonl"
          done
          ref=$(jq -r '.head.ref // ""' <<<"$pull")
          if [ -z "$ref" ]; then
            echo "::error::the head branch of #$pr could not be read."
            exit 1
          fi
          digest=$(printf '%s' "$ref" | sha256sum | cut -c1-16)
          index_mode=false
          [ ! -f "$(dirname "$VERIFY_EVIDENCE_SCRIPT")/verify-legacy-fails.json" ] || index_mode=true
          rm -f "$BABYSIT_VERIFY_LISTING"
          report=$(BABYSIT_READ_FLOOR_STOP=1 python3 "$VERIFY_EVIDENCE_SCRIPT" evidence --repo "$GITHUB_REPOSITORY" --base-sha "$BASE_SHA" "$pr" "$head") || {
            echo "::error::babysit_verify_evidence.py could not judge #$pr at $head; re-run this run."
            exit 1
          }
          printf '%s\n' "$report" | tail -n 1 >"$RUNNER_TEMP/evidence.json"
          : >"$RUNNER_TEMP/verdicts.jsonl"
          # A refusal returned before any listing (an unread config or commit
          # list) goes on with no pass names: merge-holds.mjs holds on it and on
          # the missing pass, and a trusted approval of the head lifts both. An
          # allow with no listing has no pass to bind.
          listed=true
          pass_names=("pr-verify-$pr-$head-pass" "pr-verify-$pr-$head-pass-$digest"
            "pr-verify-$pr-$head-pass-notes" "pr-verify-$pr-$head-pass-notes-$digest")
          if [ ! -s "$BABYSIT_VERIFY_LISTING" ]; then
            if jq -e --arg head "$head" '.head == $head and (.refusal | type) == "string"' "$RUNNER_TEMP/evidence.json" >/dev/null 2>&1; then
              listed=false
              echo "::notice::the verdict reader refused #$pr before listing artifacts; merge-holds.mjs judges its refusal with no pass."
            elif [ "$index_mode" = true ]; then
              # FAIL index mode: the reader reads by exact name and saves no
              # listing, so the head's pass names are read the same way.
              found=""
              for name in "${pass_names[@]}"; do
                page=$(read_api "the $name artifacts" "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" --jq '.artifacts[]') || exit 1
                found+="$page"$'\n'
              done
              jq -sc '{artifacts: .}' <<<"$found" >"$BABYSIT_VERIFY_LISTING" || {
                echo "::error::the pass artifacts of #$pr do not parse."
                exit 1
              }
              echo "the verdict reader ran in FAIL index mode for #$pr; its pass artifacts were read by exact name."
            else
              echo "::error::the verdict reader read no artifact listing for #$pr: $(tr -d '\r\n%' <"$RUNNER_TEMP/evidence.json")"
              exit 1
            fi
          fi
          [ "$listed" = false ] || for name in "${pass_names[@]}"; do
            verdict=${name#"pr-verify-$pr-$head-"}
            verdict=${verdict%"-$digest"}
            runs=$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name and .expired == false) | "\(.workflow_run.id) \(.id)"' "$BABYSIT_VERIFY_LISTING") || {
              echo "::error::the verdict reader's artifact listing does not parse."
              exit 1
            }
            while read -r run artifact; do
              [[ $run =~ ^[1-9][0-9]*$ && $artifact =~ ^[1-9][0-9]*$ ]] || continue
              record=$(read_api "run $run" "repos/$GITHUB_REPOSITORY/actions/runs/$run") || exit 1
              jq -c --arg name "$name" --arg verdict "$verdict" --argjson id "$run" --argjson artifact "$artifact" '{name: $name, verdict: $verdict, runId: $id, artifact: $artifact, run: .}' <<<"$record" >>"$RUNNER_TEMP/verdicts.jsonl" || exit 1
            done <<<"$runs"
            # A pass merge-holds.mjs verdictHold would count ends the lookup.
            ! jq -se --arg repo "$GITHUB_REPOSITORY" 'any(.runId as $id | .run | .id == $id and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/pr-verify.yml" and .event == "workflow_run" and .head_branch == "main"
              and .repository.full_name == $repo and .head_repository.full_name == $repo)' "$RUNNER_TEMP/verdicts.jsonl" >/dev/null || break
          done
          # The counted pass's record and the closing issues, for linkHold.
          artifact=$(jq -sr --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.runId as $id | .run | .id == $id and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/pr-verify.yml" and .event == "workflow_run" and .head_branch == "main"
            and .repository.full_name == $repo and .head_repository.full_name == $repo)] | first | .artifact // empty' "$RUNNER_TEMP/verdicts.jsonl") || exit 1
          # A 5xx or a network error with no HTTP response is read again after
          # each of 5, 15 and 30 s. Any other failure is final.
          record=null
          if [[ $artifact =~ ^[1-9][0-9]*$ ]]; then
            for wait in 5 15 30 ''; do
              # gh-read-exempt: a binary archive, which gh_read's text capture would corrupt.
              if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" >"$RUNNER_TEMP/verdict.zip" 2>"$RUNNER_TEMP/verdict.err"; then
                record=$(unzip -p "$RUNNER_TEMP/verdict.zip" verdict.json | jq -c .) || record=null
                break
              fi
              cat "$RUNNER_TEMP/verdict.err" >&2
              if [ -z "$wait" ] || ! grep -qiE 'HTTP 5[0-9][0-9]|error connecting to|connection reset by peer|connection refused|i/o timeout|tls handshake timeout|unexpected eof' "$RUNNER_TEMP/verdict.err"; then
                echo "::error::could not read the verdict of artifact $artifact; re-run this run."
                exit 1
              fi
              sleep "$wait"
            done
          fi
          # shellcheck disable=SC2016 # GraphQL variables, not shell
          closing=$(read_api "the closing issues of #$pr" graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:10){totalCount nodes{number repository{nameWithOwner}}}}}}' \
            -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$pr" --jq '.data.repository.pullRequest.closingIssuesReferences') || exit 1
          jq -cn --argjson record "${record:-null}" --argjson closing "${closing:-null}" '{record: $record, closing: $closing}' >"$RUNNER_TEMP/link.json" || {
            echo "::error::the verdict record or closing issues of #$pr do not parse."
            exit 1
          }
          export BASE_SHA
          out=$(node "$RUNNER_TEMP/merge-holds.mjs" "$pr" "$RUNNER_TEMP/pr-body.txt" "$RUNNER_TEMP/discussion.jsonl" \
            "$RUNNER_TEMP/files.jsonl" "$RUNNER_TEMP/denied-paths.json" "$RUNNER_TEMP/trusted-actors.json" "$head" \
            "$RUNNER_TEMP/verdicts.jsonl" "$RUNNER_TEMP/link.json" "$RUNNER_TEMP/evidence.json") || {
            printf '%s\n' "$out"
            exit 1
          }
          # Exit 0 without the module's no-hold lines ran no check: fail closed.
          printf '%s\n' "$out"
          grep -qxF "#$pr: no member veto and no hold path." <<<"$out" || { echo "::error::merge-holds.mjs exited 0 without its verdict."; exit 1; }
          grep -qE "^#$pr: no verifier hold: " <<<"$out" || { echo "::error::merge-holds.mjs exited 0 without its verifier verdict."; exit 1; }
          grep -qE "^#$pr: no pr-verify FAIL hold: " <<<"$out" || { echo "::error::merge-holds.mjs exited 0 without its pr-verify FAIL verdict."; exit 1; }
