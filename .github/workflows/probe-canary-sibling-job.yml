name: probe-canary-sibling-job

# Probe P1 variant (ii): job A and sibling job B share one reusable; only B
# references PROBE_CANARY.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  sibling:
    if: github.event.label.name == 'probe-p1'
    permissions: {}
    uses: ./.github/workflows/probe-canary-sibling-jobs.yml
    secrets:
      canary: ${{ secrets.PROBE_CANARY }}
