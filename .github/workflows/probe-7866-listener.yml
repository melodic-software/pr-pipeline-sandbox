name: probe-7866-listener

# Probe for melodic-software/claude-code-plugins#7866: shows that a
# probe-7866-relay run starts a workflow_run listener from the default branch,
# and logs the workflow_run payload fields pr-feedback-dispatch.yml reads.
# Reverted after the probe.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [probe-7866-relay]
    types: [completed]

permissions: {}

jobs:
  log:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Log the relay run's facts
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ACTOR_ID: ${{ github.event.workflow_run.actor.id }}
          TRIGGERING_ACTOR_ID: ${{ github.event.workflow_run.triggering_actor.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PR_NUMBERS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
          PR_HEAD_SHAS: ${{ join(github.event.workflow_run.pull_requests.*.head.sha, ' ') }}
        run: |
          printf 'probe-7866 %s=%s\n' \
            run_id "$RUN_ID" path "$RUN_PATH" event "$RUN_EVENT" conclusion "$RUN_CONCLUSION" \
            actor_id "$ACTOR_ID" triggering_actor_id "$TRIGGERING_ACTOR_ID" head_sha "$HEAD_SHA" \
            head_repository "$HEAD_REPO" pull_requests "$PR_NUMBERS" pull_request_head_shas "$PR_HEAD_SHAS"
