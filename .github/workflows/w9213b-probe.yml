name: w9213b-probe
on:
  push:
    branches: [w9213b-probe]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write Size on issue 197 with an issues-write installation token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '{"issue_field_values":[{"field_id":15462270,"value":"Small"}]}' |
            gh api -X POST -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/issues/197/issue-field-values" --input - \
              --jq '.[] | {issue_field_id, option: .single_select_option}'
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/${GITHUB_REPOSITORY_OWNER}/issue-fields" --jq 'length' || echo "org issue-fields listing refused, as expected"
