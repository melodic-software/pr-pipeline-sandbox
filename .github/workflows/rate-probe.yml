name: rate-probe

# Phase 9 case 12 (R-RATE): read the repository's GITHUB_TOKEN core rate-limit
# use before and after a dispatcher push. GET /rate_limit does not count
# against the limit.

on:
  workflow_dispatch:

permissions: {}

jobs:
  read:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Log core rate-limit use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api rate_limit --jq '.resources.core |
            "rate-used=\(.used) rate-limit=\(.limit) rate-remaining=\(.remaining) rate-reset=\(.reset)"'
