name: probe-hold-status

# Temporary probe: does a failing `ci-status` commit status posted from a
# base-branch pull_request_target run block a PR whose `ci-status` check run
# passes? It posts on pull requests from same-repository `probe/hold-gt`
# branches only, never checks out or runs head content, and is removed after
# the probe.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  post-hold-github-token:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'probe/hold-gt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post a failing ci-status commit status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ $HEAD_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head is not a SHA"; exit 1; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=failure -f context=ci-status -f description='probe: base-branch hold' \
            --jq '{id, context, state, creator: .creator.login}'
