name: probe-b2-status
# Temporary probe: does a GITHUB_TOKEN commit status satisfy a ruleset check pinned to integration 15368?
# pull_request_target runs the base branch's copy; nothing from the head is checked out or run.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [probe/b2-base]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  post-status:
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Post probe-b2-context on the head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REF" = "probe/b2-silent" ]; then
            echo "head is probe/b2-silent; posting nothing"
            exit 0
          fi
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success -f context=probe-b2-context -f description="B2 probe" \
            --jq '{id, context, state, creator: .creator.login}'
