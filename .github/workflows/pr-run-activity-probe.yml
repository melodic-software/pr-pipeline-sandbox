name: pr-run-activity-probe

# Test caller of pr-run-activity.yml: one job per activity in
# docs/conventions/pr-pipeline.yaml. Only a test caller offers config-path.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The sandbox PR to run the activities on.
        required: true
        type: string
      config-path:
        description: The config, relative to the base checkout.
        required: false
        type: string
        default: docs/conventions/pr-pipeline.yaml

permissions: {}

jobs:
  check-sandbox:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-check-sandbox-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-run-checks
      activity: check-sandbox
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      app-private-key: ''

  check-disabled:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-check-disabled-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-run-checks
      activity: check-disabled
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      app-private-key: ''

  check-token:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-check-token-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-run-checks
      activity: check-token
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      app-private-key: ''

  fix-marker:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-fix-marker-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-refine
      activity: fix-marker
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app-private-key: ''

  explain-marker:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-explain-marker-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-explain
      activity: explain-marker
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app-private-key: ''

  check-hardening:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-check-hardening-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-run-checks
      activity: check-hardening
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      app-private-key: ''

  check-trusted-text:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-check-trusted-text-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-run-checks
      activity: check-trusted-text
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      app-private-key: ''

  review-gate:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-review-gate-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-review
      activity: review-gate
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app-private-key: ''

  audit-env:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-audit-env-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity.yml
    with:
      lane: pr-review
      activity: audit-env
      config-path: ${{ inputs.config-path || 'docs/conventions/pr-pipeline.yaml' }}
      pr-number: ${{ inputs.pr-number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app-private-key: ''
