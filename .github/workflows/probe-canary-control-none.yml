name: probe-canary-control-none

# Probe P1 negative control: no file in this run references PROBE_CANARY.
# `***` here means every repository secret reaches every job, and the other
# P1 variants prove nothing.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  echo:
    if: github.event.label.name == 'probe-p1'
    permissions: {}
    uses: ./.github/workflows/probe-canary-echo-job.yml
