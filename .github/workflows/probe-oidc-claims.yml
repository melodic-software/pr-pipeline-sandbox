name: probe-oidc-claims

# Probes P2 and P3 for the token broker design. The reusable job prints the
# decoded OIDC claims (never the token), the actor contexts and the run-attempt
# triggering actor (P2), then reads the caller and the reusable through the
# contents API at workflow_sha and job_workflow_sha (P3).

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

jobs:
  claims:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'probe-p2'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/probe-oidc-claims-job.yml
