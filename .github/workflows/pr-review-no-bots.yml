name: pr-review-no-bots

# Sandbox control for Phase 9 case 14: the code-review reusable with an empty
# allowed-bot-sender-ids, so a lanes App push is skipped. docs-only-paths
# matches every file, so a human event runs no model either.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-review-no-bots:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-review.yml@a92020292976c2e9b50f7adc922693a45a6c1226
    with:
      runner: ubuntu-24.04
      allowed-bot-sender-ids: ""
      docs-only-paths: "**"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
