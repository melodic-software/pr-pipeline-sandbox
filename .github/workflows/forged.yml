name: forged

# Security probe: a second workflow emitting a check named ci-status that always
# passes. Must never merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-status:
    name: ci-status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Always pass
        run: sleep 90 && true
