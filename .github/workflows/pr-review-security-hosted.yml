name: pr-review-security-hosted

# Sandbox caller of the org pr-review-cli reusable, lane `security`, at the
# pin and hold inputs claude-code-plugins#9361 uses. The job id
# `pr-review-security` keeps the check `pr-review-security / security-review`,
# which ci-status's `Require both review lanes on this head` step reads. No
# resolve-model job: the review runs on the reusable's default model.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  kill-switch:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the kill-switch action
    outputs:
      proceed: ${{ steps.kill.outputs.proceed == 'true' && vars.CLAUDE_SECURITY_REVIEW_DISABLED != 'true' && 'true' || 'false' }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true' || vars.CLAUDE_SECURITY_REVIEW_DISABLED == 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          LANE_SWITCH: ${{ vars.CLAUDE_SECURITY_REVIEW_DISABLED }}
        run: |
          echo "::notice::a kill switch stops this security review (lanes: ${REASON:-unreadable}, CLAUDE_SECURITY_REVIEW_DISABLED: ${LANE_SWITCH:-unset})"

  pr-review-security:
    needs: [kill-switch]
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.kill-switch.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: write # the review, its comments, the marker and the hold label
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@9aca743c4ed9aaf7870288a36586c3994e9321e4 # v0.64.1
    with:
      lane: security
      publish: comments
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
      docs-only-paths: |
        docs/**/*.md
        **/README.md
        **/CHANGELOG.md
      # Keep both lists equal in the two callers.
      hold-label: needs-human
      hold-paths: |
        .github/standards/trusted-actors/**
        .github/actions/check-trusted-trigger/**
        **/CODEOWNERS
        **/.gitmodules
    secrets:
      CLAUDE_API_KEY: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWS_CLAUDE_CODE_OAUTH_TOKEN }}
