name: pr-review-security-hosted

# Sandbox caller of the org security-review reusable, pinned at the
# ci-workflows commit that adds allowed-bot-sender-ids (Phase 9 case 14).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  pr-review-security:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: pr-review-security-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-security.yml@a92020292976c2e9b50f7adc922693a45a6c1226
    with:
      runner: ubuntu-24.04
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
