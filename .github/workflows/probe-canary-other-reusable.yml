name: probe-canary-other-reusable

# Probe P1 variant (iii), the T16 case: job `echo` calls a reusable with no
# secret; job `hold` of this same caller passes PROBE_CANARY to a different
# reusable.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  echo:
    if: github.event.label.name == 'probe-p1'
    permissions: {}
    uses: ./.github/workflows/probe-canary-echo-job.yml

  hold:
    if: github.event.label.name == 'probe-p1'
    permissions: {}
    uses: ./.github/workflows/probe-canary-hold-job.yml
    secrets:
      canary: ${{ secrets.PROBE_CANARY }}
