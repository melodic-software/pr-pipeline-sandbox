name: PR Run Activity Read Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["sandbox/read-split/**"]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The sandbox PR to run the activities on.
        required: true
        type: string

permissions: {}

jobs:
  check-read-token:
    name: Check Read Token
    permissions:
      actions: read
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-check-read-token-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    # The ./ form claude-code-plugins' lane callers use, so the sandbox runs the call they run.
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      lane: pr-run-checks
      activity: check-read-token
      pr-number: ${{ inputs.pr-number }}
    secrets:
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}
