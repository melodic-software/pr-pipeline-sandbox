name: pr-run-activity-read-probe

# Test caller of pr-run-activity-read.yml. It passes only the scan-carrier
# key, which the read runner requires and its scan job alone reads, so no App
# key or OAuth token reaches the run. Runs only on PRs that touch
# sandbox/read-split/**.
#   read-token:     case 6, a read script activity; expected success.
#   write-via-read: case 7a, a mutate-branch activity sent to the read
#                   workflow; expected failure with effect-not-read before the
#                   head checkout.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["sandbox/read-split/**"]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The sandbox PR to run the activities on.
        required: true
        type: string

permissions: {}

jobs:
  read-token:
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-read-token-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml
    with:
      lane: pr-run-checks
      activity: check-read-token
      pr-number: ${{ inputs.pr-number }}
    secrets:
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  write-via-read:
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-write-via-read-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml
    with:
      lane: pr-refine
      activity: check-write-effect
      pr-number: ${{ inputs.pr-number }}
    secrets:
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}
