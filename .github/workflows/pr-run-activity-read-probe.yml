name: PR Run Activity Read Probe

# Test caller of pr-run-activity-read.yml. It passes only the scan-carrier
# key, which the read runner requires and its scan job alone reads, so no App
# key or OAuth token reaches the run. Runs only on PRs that touch
# sandbox/read-split/**.
#   check-read-token: case 6, a read script activity; expected success.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["sandbox/read-split/**"]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The sandbox PR to run the activities on.
        required: true
        type: string

permissions: {}

jobs:
  check-read-token:
    name: Check Read Token
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-check-read-token-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml
    with:
      lane: pr-run-checks
      activity: check-read-token
      pr-number: ${{ inputs.pr-number }}
    secrets:
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}
