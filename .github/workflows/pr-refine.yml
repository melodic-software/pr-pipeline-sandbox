name: pr-refine

# Lane caller for pr-refine: its file stem is the lane, so the lanes token
# broker accepts its write activities. No App key; the run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.

# fix-docs-dispatch.mjs reads this title to skip a second dispatch while one
# for the same activity and PR is still queued or going. Quoted: unquoted,
# " #" would start a YAML comment and drop the PR number.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('pr-refine {0} #{1}', inputs.activity, inputs.pr-number) || 'pr-refine' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The sandbox PR to run the activity on.
        required: true
        type: string
      activity:
        description: >-
          refine runs fix-marker and audit-env-write; fix-ci-fallback runs only
          the Phase 5b fallback probe below; fix-docs runs main's fix-docs, and
          fix-docs-no-key runs it with an empty key (Phase 7.1 probes).
        required: false
        type: choice
        options: [refine, fix-ci-fallback, fix-docs, fix-docs-no-key]
        default: refine
      dispatcher-run-id:
        description: The dispatcher run that sent this dispatch; empty for a human dispatch.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  fix-marker:
    # The lanes App's own pull_request events never start a lane, so a lane
    # push never waits in the per-PR write queue.
    if: >-
      !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
      && (inputs.activity == '' || inputs.activity == 'refine')
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      # One per-PR queue shared by every write lane: it queues, never cancels.
      group: pr-pipeline-write-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml
    with:
      role: automations
      lane: pr-refine
      activity: fix-marker
      pr-number: ${{ inputs.pr-number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  audit-env-write:
    # The lanes App's own pull_request events never start a lane, so a lane
    # push never waits in the per-PR write queue.
    if: >-
      !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
      && (inputs.activity == '' || inputs.activity == 'refine')
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      # One per-PR queue shared by every write lane: it queues, never cancels.
      group: pr-pipeline-write-${{ github.event.pull_request.number || inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml
    with:
      role: automations
      lane: pr-refine
      activity: audit-env-write
      pr-number: ${{ inputs.pr-number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  # Sandbox-only probe of fix-ci's subscription fallback (claude-code-plugins
  # Phase 5b, probe P2): pr-unblock.yml's fix-ci jobs on lane pr-refine,
  # except that the first call passes a key secret that is never set, so it
  # reports credential-present=false and hands off, and fix-ci-subscription
  # runs the activity on AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN. A credit stop
  # cannot be forced. On main because a dispatch runs there and the broker
  # refuses a caller that differs from main's tip. Remove after the probe.
  fix-ci-context:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.activity == 'fix-ci-fallback'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR's head and commits
      checks: read # the head's check runs and their annotations
      actions: read # each failing job's workflow file and log
    outputs:
      proceed: ${{ steps.context.outputs.proceed }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      escalation-reason: ${{ steps.context.outputs.escalation-reason }}
      context-sha256: ${{ steps.context.outputs.context-sha256 }}
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Install resolve-config's dependencies
        if: steps.kill.outputs.proceed == 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Write the failing checks' context
        id: context
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          CONTEXT_FILE: ${{ runner.temp }}/ci-context/context.json
          BASE_PATH: .base
        run: |
          mkdir -p "$RUNNER_TEMP/ci-context"
          node .base/.github/scripts/pr-unblock/fix-ci-context.mjs

      - name: Upload the context
        id: upload
        if: steps.context.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-context/context.json
          retention-days: 1
          if-no-files-found: error

  fix-ci:
    needs: fix-ci-context
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml
    with:
      role: automations
      lane: pr-refine
      activity: fix-ci
      pr-number: ${{ inputs.pr-number }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      # Never set, in the sandbox or the org.
      claude-api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY_PROBE_UNSET }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  fix-ci-subscription:
    needs: [fix-ci-context, fix-ci]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && (needs.fix-ci.outputs.lane-class == 'credit-stop'
      || needs.fix-ci.outputs.credential-present == 'false') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml
    with:
      role: automations
      lane: pr-refine
      activity: fix-ci
      fallback: ${{ needs.fix-ci.outputs.lane-class == 'credit-stop' && 'credit-stop' || 'no-key' }}
      pr-number: ${{ inputs.pr-number }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  apply-patch:
    needs: [fix-ci-context, fix-ci, fix-ci-subscription]
    if: >-
      ${{ !cancelled() && ((needs.fix-ci-subscription.outputs.patch-state || needs.fix-ci.outputs.patch-state) == 'written'
      || (needs.fix-ci-subscription.outputs.patch-state || needs.fix-ci.outputs.patch-state) == 'empty') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml
    with:
      role: automations
      lane: pr-refine
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-subscription.outputs.patch-state || needs.fix-ci.outputs.patch-state }}
      patch-sha256: ${{ needs.fix-ci-subscription.outputs.patch-sha256 || needs.fix-ci.outputs.patch-sha256 }}
      patch-attempt: ${{ needs.fix-ci-subscription.outputs.patch-attempt || needs.fix-ci.outputs.patch-attempt }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      # The head fix-ci-context gated, from a job that ran no head code, as in
      # pr-unblock.yml.
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      reply-attempt: ${{ needs.fix-ci-subscription.outputs.reply-attempt || needs.fix-ci.outputs.reply-attempt }}

  # main's fix-docs jobs at claude-code-plugins 60278a764f (Phase 7.1 probes
  # P1-P3), on dispatch only, on the automations role. fix-docs-no-key passes
  # an empty key, so the first call hands off and fix-docs-subscription runs
  # on the OAuth token (P2).
  # The PR head fix-docs's report posts its check on, read by a job that runs
  # no head code, as fix-ci-context's is for fix-ci. Without it the report
  # trusts only the head read at report time, so a push mid-run posts failure
  # on the new head.
  # It also reads whether the human-gated label holds fix-docs: only when a
  # lane escalation did not put it on (lane-hold.mjs); a held PR runs nothing.
  fix-docs-head:
    if: >-
      inputs.pr-number != '' && (inputs.activity == 'fix-docs' || inputs.activity == 'fix-docs-no-key')
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out main
      pull-requests: read
    outputs:
      head-sha: ${{ steps.head.outputs.sha }}
      held: ${{ steps.hold.outputs.held }}
      lane-escalated: ${{ steps.hold.outputs.lane-escalated }}
    steps:
      - name: Read the PR's head SHA
        id: head
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number is not a PR number"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no PR head SHA read"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the human-gated hold
        id: hold
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          ACTIVITY: fix-docs
        run: node .base/.github/scripts/pr-unblock/lane-hold.mjs

  # fix-docs is four jobs, so no model ever holds a write token. The model
  # job: a read activity with no write token and no OIDC token in the job that
  # runs head code. The skill fixes the changed Markdown files; the runner
  # uploads its uncommitted edits as a patch. It runs on the pr-unblock
  # role's API key alone (automations here). Drafts and do-not-merge PRs skip in the config's
  # applies-when, a human-gated hold in fix-docs-head, before any model turn.
  fix-docs:
    needs: fix-docs-head
    if: >-
      inputs.pr-number != '' && (inputs.activity == 'fix-docs' || inputs.activity == 'fix-docs-no-key')
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.fix-docs-head.outputs.held == 'false'
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-refine
      activity: fix-docs
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ inputs.activity != 'fix-docs-no-key' && secrets.AUTOMATIONS_CLAUDE_API_KEY || '' }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-docs's report job posted its check, and whether the broker
  # allowed the call, read from this run's jobs through the Actions API, as
  # pr-unblock.yml's fix-ci-handoff reads them for fix-ci: never from a
  # fix-docs output, since fix-docs's run job runs head code and can forge
  # handed-off, lane-class or credential-present. A failed read leaves both
  # empty, which starts no fallback; with no check posted,
  # fix-docs-dispatch.mjs dispatches the PR again.
  fix-docs-handoff:
    needs: [fix-docs-head, fix-docs]
    if: ${{ !cancelled() && needs.fix-docs.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
      allowed: ${{ steps.posted.outputs.allowed }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: .github/scripts/lib/handoff-evidence.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-docs posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-docs
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted allowed

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when the broker allowed fix-docs and fix-docs posted no check, which
  # a credit stop or an empty key leaves as a handoff with no upload, lane
  # record or check. fix-docs posts nothing on a decline (post-decline: false),
  # so the broker's allow keeps a kill switch or a refusal from starting a
  # second leg. Its start reads only fix-docs-handoff, and it holds the OAuth
  # token alone. fallback: handoff labels the lane record without reading a
  # fix-docs output: only the run job knows whether it was a credit stop or an
  # empty key, and head code can forge that.
  fix-docs-subscription:
    needs: [fix-docs-head, fix-docs, fix-docs-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-docs.result != 'skipped'
      && needs.fix-docs-handoff.outputs.posted != 'true'
      && needs.fix-docs-handoff.outputs.allowed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-refine
      activity: fix-docs
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # fix-docs's push job: the apply-patch activity under patch-rules.json's
  # default row (fix-docs has no prepare mode). It runs only on a written
  # patch: no change is the common case and needs no one. The lane has no
  # escalation job, so a refused patch posts the pr-refine / apply-patch
  # check neutral and labels nothing. One leg answers, as for pr-unblock.yml's
  # apply-patch: the fallback call when it ran, else the first, and every
  # input is that leg's scan job's, never a run job's, since the run job runs
  # head code. The head is fix-docs-head's, read by a job that ran no head
  # code; apply-patch still applies onto the head its own gate reads.
  apply-docs-patch:
    needs: [fix-docs-head, fix-docs, fix-docs-subscription]
    if: >-
      ${{ !cancelled()
      && (needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-state || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-state || '') == 'written' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-refine
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-state || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-sha256 || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-attempt || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-docs
      patch-head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      # true drops the human-gated label from the holds: a lane escalation
      # put it on (lane-hold.mjs).
      patch-fix-requested: ${{ needs.fix-docs-head.outputs.lane-escalated }}
      reply-attempt: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-reply-attempt || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-reply-attempt || '' }}
