name: probe-canary-skipped-step

# Probe P1 variant (i): job A references PROBE_CANARY only in a step that never
# runs. The call below passes the secret to the reusable that holds job A.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  echo:
    if: github.event.label.name == 'probe-p1'
    permissions: {}
    uses: ./.github/workflows/probe-canary-skipped-step-job.yml
    secrets:
      canary: ${{ secrets.PROBE_CANARY }}
