name: probe-stack-payload

# Prints the stack and base fields of the pull_request payload a layer of a
# native stack receives. Reads the event file only; holds no token scope.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print the stack and base fields
        run: |
          jq '{event_action: .action, default_branch: .repository.default_branch, number: .pull_request.number, base_ref: .pull_request.base.ref, base_sha: .pull_request.base.sha, head_ref: .pull_request.head.ref, head_sha: .pull_request.head.sha, stack: .pull_request.stack}' "$GITHUB_EVENT_PATH"
          echo "github.base_ref=${GITHUB_BASE_REF}"
