name: r-act-dispatch

# Phase 1 R-ACT probe (claude-code-plugins pr-pipeline-unblock): dispatches
# r-act-probe.yml with GITHUB_TOKEN so the probe can log who GitHub says
# started it. Runs on the merge that adds it and by hand. Reverted after.

on:
  push:
    branches: [main]
    paths: [.github/workflows/r-act-dispatch.yml]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the probe with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
          DISPATCHER_EVENT: ${{ github.event_name }}
        run: |
          echo "dispatcher-run-id=$DISPATCHER_RUN_ID dispatcher-event=$DISPATCHER_EVENT"
          gh workflow run r-act-probe.yml --ref main \
            -f dispatcher-run-id="$DISPATCHER_RUN_ID" -f dispatcher-event="$DISPATCHER_EVENT"
