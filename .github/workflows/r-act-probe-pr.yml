name: r-act-probe-pr

# Phase 1 R-ACT run-read check from a pull_request run, with the run job's
# permission set. Probe PR only; closed unmerged.

on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Log actor fields, OIDC claims and run reads
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER_ID: ${{ github.event.sender.id }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          GH_ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DISPATCHER_RUN_ID: '38148710292'
          DISPATCHER_EVENT: none
          OWN_RUN_ID: ${{ github.run_id }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          echo "dispatcher-run-id=$DISPATCHER_RUN_ID dispatcher-event=$DISPATCHER_EVENT"
          echo "sender-id=$SENDER_ID sender-login=$SENDER_LOGIN"
          echo "github-actor=$GH_ACTOR github-actor-id=$GH_ACTOR_ID"
          echo "triggering-actor=$TRIGGERING_ACTOR"
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=r-act-probe" | jq -r .value)
          echo "::add-mask::$oidc"
          payload=$(cut -d. -f2 <<<"$oidc" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+='='; done
          claims=$(base64 -d <<<"$payload")
          unset oidc payload
          jq -r '"oidc-actor=\(.actor)", "oidc-actor-id=\(.actor_id)", "oidc-run-id=\(.run_id)",
            "oidc-event-name=\(.event_name)", "oidc-ref=\(.ref)", "oidc-workflow-ref=\(.workflow_ref)"' <<<"$claims"
          read_run() {
            curl -sS -o "$RUNNER_TEMP/run-$1.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API/actions/runs/$1"
          }
          echo "runs-read=$(read_run "$DISPATCHER_RUN_ID")"
          echo "own-run-read=$(read_run "$OWN_RUN_ID")"
          for f in "$RUNNER_TEMP"/run-*.json; do
            jq -r '"run-record \(.id // "-") event=\(.event // "-") actor=\(.actor.login // "-") triggering_actor=\(.triggering_actor.login // "-") message=\(.message // "-")"' "$f"
          done
