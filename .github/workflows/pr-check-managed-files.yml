name: pr-check-managed-files

# Sandbox probe of the check-managed-files action's merge-group mode
# (ci-workflows#825): a merge_group run maps the group to its pull requests and
# checks each one's own diff. Pinned at the release claude-code-plugins uses.
# Advisory: not in ci-status, so a red run does not block the queue.
#
# The sandbox is not a sync-manifest target, so `repository` names
# claude-code-plugins to give the per-PR check a real managed-path set.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-managed-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge-group mode diffs base_sha...head_sha.
          fetch-depth: 0
      - uses: melodic-software/ci-workflows/.github/actions/check-managed-files@3a2c748fdef9cfb9ceec5a66289e21842189689f # v0.55.0
        with:
          repository: melodic-software/claude-code-plugins
