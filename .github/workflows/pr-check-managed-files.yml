name: PR Check Managed Files

# Sandbox probe of the check-managed-files action's merge-group mode
# (ci-workflows#825): a merge_group run maps the group to its pull requests and
# checks each one's own diff. Pinned at the release claude-code-plugins uses.
# Advisory: not in ci-status, so a red run does not block the queue.
#
# The sandbox is a standards sync-manifest target, so the action checks this
# repository's own managed-path set.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-managed-files:
    name: Check Managed Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge-group mode diffs base_sha...head_sha.
          fetch-depth: 0
      - uses: melodic-software/ci-workflows/.github/actions/check-managed-files@main
