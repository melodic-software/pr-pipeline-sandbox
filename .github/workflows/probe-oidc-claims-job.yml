name: probe-oidc-claims-job

# Reusable half of probes P2 and P3: job_workflow_ref names this file, so the
# claims show how the broker sees a lane's local reusable.

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Print the decoded OIDC claims (P2)
        id: claims
        run: |
          set -euo pipefail
          token=$(curl -sS --fail --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe-broker" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          unset token
          while (( ${#payload} % 4 )); do payload+='='; done
          claims=$(base64 -d <<<"$payload")
          echo "All claims:"
          jq . <<<"$claims"
          echo "Claims the broker design reads:"
          jq -r '[
            "workflow_ref", "workflow_sha", "job_workflow_ref", "job_workflow_sha",
            "ref", "event_name", "check_run_id", "run_id", "run_attempt",
            "actor", "actor_id", "repository_id", "repository_owner_id",
            "runner_environment"
          ][] as $k | "\($k)=\(.[$k] // "<absent>")"' <<<"$claims"
          for k in workflow_ref workflow_sha job_workflow_ref job_workflow_sha; do
            echo "$k=$(jq -r --arg k "$k" '.[$k] // ""' <<<"$claims")" >> "$GITHUB_OUTPUT"
          done

      - name: Print the actor contexts and the run-attempt triggering actor (P2)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CTX_ACTOR: ${{ github.actor }}
          CTX_ACTOR_ID: ${{ github.actor_id }}
          CTX_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          echo "github.actor=$CTX_ACTOR"
          echo "github.actor_id=$CTX_ACTOR_ID"
          echo "github.triggering_actor=$CTX_TRIGGERING_ACTOR"
          echo "github.run_attempt=$RUN_ATTEMPT"
          echo "run-attempt API:"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" --jq '{
            run_attempt, event, head_sha,
            actor: {login: .actor.login, id: .actor.id},
            triggering_actor: {login: .triggering_actor.login, id: .triggering_actor.id}
          }'

      - name: Read the caller and the reusable at their run SHAs (P3)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ steps.claims.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ steps.claims.outputs.workflow_sha }}
          JOB_WORKFLOW_REF: ${{ steps.claims.outputs.job_workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ steps.claims.outputs.job_workflow_sha }}
        run: |
          set -uo pipefail
          failed=0
          read_at() {
            local label=$1 path=$2 ref=$3 status sha
            status=$(curl -sS -o body.json -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/contents/$path?ref=$ref")
            if [ "$status" = 000 ]; then failed=1; fi
            sha=$(jq -r '.sha // .message // empty' body.json 2>/dev/null)
            echo "$label path=$path ref=$ref status=$status blob=$sha"
            echo "| $label | \`$path\` | \`$ref\` | $status | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          }
          caller_path=${WORKFLOW_REF#"$REPOSITORY/"}
          caller_path=${caller_path%%@*}
          reusable_path=${JOB_WORKFLOW_REF#"$REPOSITORY/"}
          reusable_path=${reusable_path%%@*}
          {
            echo "### P3 contents reads"
            echo "| read | path | ref | status | blob sha or message |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          read_at caller-at-workflow_sha "$caller_path" "$WORKFLOW_SHA"
          read_at reusable-at-job_workflow_sha "$reusable_path" "$JOB_WORKFLOW_SHA"
          read_at caller-at-default-branch "$caller_path" "$DEFAULT_BRANCH"
          read_at reusable-at-default-branch "$reusable_path" "$DEFAULT_BRANCH"
          exit "$failed"
