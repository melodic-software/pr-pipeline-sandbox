name: probe-7866-relay

# Probe for melodic-software/claude-code-plugins#7866, the shape of that
# repository's pr-review-comment-relay.yml: an unprivileged run on a new review
# comment. Its run's actor, head_sha and pull_requests, and whether it runs on
# a PR with a merge conflict, are the four facts the build depends on. Reverted
# after the probe.

on:
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Relay the comment
        run: echo "probe-7866 relay ran"
