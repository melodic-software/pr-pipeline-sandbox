# TypeScript and JavaScript in pr-pipeline-sandbox. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# This repository's CI runs no build or test command, and its one lint is zizmor
# over the GitHub Actions YAML (yaml.yaml): pr-require-checks.yml has three jobs,
# check-force-red (a .ci-force-red file test), pr-audit-workflows (zizmor) and
# ci-status (those results plus the review and hold gates), and the sandbox's
# resolve-issue lane keeps "no checks" (docs/conventions/pr-pipeline.yaml,
# resolve-issue entry).
# So every command here is null, and no bundled default fills one in.
# Keeps toolchain's bundled typescript globs; project-discovery is empty, so no package.json root is walked.
enabled: true
globs: ["*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs", "package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "tsconfig*.json"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: null
fix-cmd: null
code-fix-cmd: null
gates: []
notes: "Null by design: CI here gates no TypeScript and JavaScript command. Most files are copies from claude-code-plugins, linted and tested there, and scripts/lanes/check-sync.sh requires the synced ones to stay byte-identical, which a fix-cmd would break. Add a command here when a CI lane in this repository starts running one."
