# yaml-language-server: $schema=https://raw.githubusercontent.com/melodic-software/claude-code-plugins/main/plugins/code-tidying/schemas/comment-policy.schema.json
comment_posture: necessary
comment_lint: block
comment_lint_allow:
  # reader: synced files stay byte-identical to claude-code-plugins, whose tools read these markers: https://github.com/melodic-software/pr-pipeline-sandbox/blob/main/scripts/lanes/check-sync.sh
  - '^(#|//)[[:space:]]*test-scope:'
  - '^(#|//)[[:space:]]*fixture-isolation-scope:[[:space:]]*[^[:space:]]'
  - '^(#|//)[[:space:]]*(BEGIN|END) hold-floor[[:space:]]'
  - '^/\*[[:space:]]*rv-chrome:(begin|end)[[:space:]]*\*/$'
comment_lint_keep_opening:
  # owner-keep: synced claude-code-plugins eval scaffolds keep the summary a person reads before approving a run, as there: https://github.com/melodic-software/claude-code-plugins/blob/main/docs/conventions/comment-policy.yaml
  - plugins/*/evals/*/scaffold.sh
  - plugins/*/evals/**/fixtures/**/*.sh
  - plugins/source-control/evals/fixtures/gh-forge/gh
  - plugins/source-control/evals/fixtures/gh-forge/git
  - plugins/source-control/evals/fixtures/gh-forge/git-remote-evalforge
