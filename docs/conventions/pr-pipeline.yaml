# yaml-language-server: $schema=pr-pipeline/pr-pipeline.schema.json
version: 2

activities:
  fix-docs:
    skill: ai-slop:audit
    args: fix
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: true
    inputs: [changed-paths]
    applies-when:
      paths: ["**/*.md"]
      labels-absent: [do-not-merge]
      draft: [false]
  check-sandbox:
    script: scripts/lanes/check-sandbox.sh
    effect: read
    gating: gate
    reads-untrusted: false
  check-disabled:
    script: scripts/lanes/check-sandbox.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  check-token:
    script: scripts/lanes/check-token.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  check-broker:
    script: scripts/lanes/check-broker.sh
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: false
  fix-marker:
    skill: sandbox-marker:fix-marker
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/refine/**"]
  explain-marker:
    skill: sandbox-marker:explain-marker
    effect: read
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["plugins/**", ".claude/**", ".claude-plugin/**"]
  check-hardening:
    script: scripts/lanes/check-hardening.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  review-gate:
    skill: sandbox-marker:review-gate
    effect: read
    gating: gate
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/gate/**"]
  audit-env:
    skill: sandbox-marker:audit-env
    effect: read
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/env/**"]

  check-trusted-text:
    script: scripts/lanes/check-trusted-text.sh
    effect: read
    gating: advisory
    reads-untrusted: true
    applies-when:
      paths: ["sandbox/trusted-text/**"]

  check-read-token:
    script: scripts/lanes/check-read-token.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  resolve-conflicts:
    skill: source-control:pull-request
    args: conflicts --ci --unattended
    prepare: merge-base
    effect: read
    applied-by:
      patch: apply-conflict-patch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      mergeable: [conflicting]
      labels-absent: [do-not-merge]
      draft: [false]
  address-feedback:
    skill: source-control:pull-request
    args: comments --ci
    prepare: review-threads
    effect: read
    applied-by:
      patch: apply-feedback-patch
      feedback-replies: publish-feedback
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge]
      draft: [false]
  publish-feedback:
    script: .github/scripts/pr-unblock/publish-feedback.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  review-dependency:
    skill: source-control:pull-request
    args: dependency --ci
    prepare: dependency-review
    web-access:
      enabled: true
      domains: [github.com, raw.githubusercontent.com, www.npmjs.com, registry.npmjs.org, pypi.org]
    effect: read
    applied-by:
      patch: apply-dependency-patch
      dependency-verdict: apply-dependency-verdict
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  apply-dependency-verdict:
    script: .github/scripts/pr-unblock/apply-dependency-verdict.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  fix-ci:
    skill: source-control:pull-request
    args: ci --ci
    prepare: ci-context
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge]
      draft: [false]
  apply-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge]
      draft: [false]
  report-escalation:
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]

  resolve-issue:
    skill: work-items:work
    args: --ci
    self-checks: [scripts/check-affected.sh --uncommitted]
    verify-scripts:
      - scripts/git-mv-rm.sh
    web-access:
      enabled: true
      domains: any
    effect: read
    applied-by:
      patch: apply-issue-patch
      work-outcome: report-outcome
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
    applies-when:
      events: [field_added]
      labels-absent: [needs-human, needs-owner-decision, needs-reporter-info]
      labels: [agent-ready]
  apply-issue-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs:
      - issue
    applies-when:
      labels-absent:
        - needs-human
        - needs-owner-decision
        - needs-reporter-info
      labels:
        - agent-ready
  report-outcome:
    script: .github/scripts/work-resolve-issue/report-outcome.mjs
    effect: publish-artifact
    checkout: base
    gating: advisory
    reads-untrusted: false
    inputs: [issue]

  merge-pr:
    script: plugins/source-control/scripts/source-control-babysit-merge
    args: --unattended --authority pr-merge --merge
    effect: merge
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  enable-auto-merge:
    script: .github/scripts/pr-merge/enable-auto-merge.mjs
    effect: merge
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  apply-conflict-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha, base-sha]
    applies-when:
      labels-absent: [do-not-merge]
      draft: [false]
  apply-feedback-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge]
      draft: [false]
  resolve-feedback-threads:
    script: .github/scripts/pr-unblock/resolve-threads.mjs
    effect: mutate-branch
    checkout: base
    gating: advisory
    reads-untrusted: true
    inputs: [pr]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  sync-shared-copies:
    script: .github/scripts/pr-unblock/sync-shared-copies.sh
    effect: read
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  apply-shared-copies:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha, base-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  apply-dependency-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]

lanes:
  pr-merge:
    stage: merge
    slots:
      - activity: merge-pr
      - activity: enable-auto-merge
  work-resolve-issue:
    stage: build
    slots:
      - activity: resolve-issue
      - activity: apply-issue-patch
        needs:
          - resolve-issue
      - activity: report-outcome
        needs:
          - resolve-issue
          - apply-issue-patch
  pr-unblock:
    stage: fix
    slots:
      - activity: resolve-conflicts
      - activity: apply-conflict-patch
        needs: [resolve-conflicts]
      - activity: address-feedback
      - activity: apply-feedback-patch
        needs: [address-feedback]
      - activity: publish-feedback
        needs: [address-feedback, apply-feedback-patch]
      - activity: resolve-feedback-threads
        enabled: false
      - activity: review-dependency
      - activity: apply-dependency-patch
        needs: [review-dependency]
      - activity: apply-dependency-verdict
        needs: [review-dependency, apply-dependency-patch]
      - activity: fix-ci
      - activity: apply-patch
        needs: [fix-ci]
      - activity: sync-shared-copies
        enabled: false
      - activity: apply-shared-copies
        enabled: false
        needs: [sync-shared-copies]
      - activity: report-escalation
        needs: [resolve-conflicts, apply-conflict-patch, address-feedback, publish-feedback, review-dependency, apply-dependency-verdict, fix-ci, apply-patch]
  pr-run-checks:
    stage: verify
    slots:
      - activity: check-sandbox
      - activity: check-disabled
        enabled: false
      - activity: check-token
      - activity: check-hardening
      - activity: check-trusted-text
      - activity: check-read-token
  pr-refine:
    stage: refine
    slots:
      - activity: fix-marker
      - activity: check-broker
      - activity: fix-ci
      - activity: fix-docs
      - activity: apply-patch
        needs: [fix-ci, fix-docs, fix-marker]
  pr-explain:
    stage: verify
    slots:
      - activity: explain-marker
  pr-review:
    stage: verify
    slots:
      - activity: review-gate
      - activity: audit-env

models:
  profiles:
    standard:
      model: opus
      max-turns: 75
    turns-10:
      model: opus
      max-turns: 10
    turns-6:
      model: opus
      max-turns: 6
    turns-5:
      model: opus
      max-turns: 5
    code-fix:
      role: worker
      workload: code
      effort-role: verifier
      max-turns: 75
      escalate-to: code-xhigh
    docs-fix:
      role: worker
      workload: mechanical
      max-turns: 75
    review:
      model: opus
      max-turns: 60
    pr-review:
      model: sonnet
      effort: high
      max-turns: 75
    triage:
      model: sonnet
      effort: medium
      max-turns: 30
    summary:
      model: sonnet
      effort: medium
      max-turns: 10
    code-xhigh:
      model: opus
      effort: xhigh
      max-turns: 75
  default-profile: standard
  routes:
    fix-ci: code-fix
    fix-docs: docs-fix
    fix-marker: turns-10
    explain-marker: turns-5
    review-gate: turns-5
    audit-env: turns-6
    resolve-conflicts: code-fix
    address-feedback: code-fix
    review-dependency: review
    verify-pr: review
    review-code: pr-review
    review-security: pr-review
    triage-issue: triage
    summarize-reuse: summary
    resolve-issue: code-fix
  issue-dimensions:
    fields:
      size:
        field-id: 15462270
        options:
          "27053568": small
          "27053567": medium
          "27053566": large
      complexity:
        field-id: 48625720
        options:
          "85127651": low
          "85127652": medium
          "85127653": high
      uncertainty:
        field-id: 48625721
        options:
          "85127654": known
          "85127655": knowable
          "85127656": unknown
    sizes:
      small:
        base-turns: 75
        timeout-minutes: 65
      medium:
        base-turns: 150
        timeout-minutes: 115
      large: split
    complexity:
      low: 1
      medium: 1.5
      high: 2
    complexity-profiles:
      high: code-xhigh
    uncertainty:
      known: run
      knowable: run
      unknown: probe-first
  issue-status:
    field-id: 48484079
    bot-setters:
      - id: 41898282
        login: "github-actions[bot]"
      - id: 300666570
        login: "melodic-standards-sync[bot]"
      - id: 288071998
        login: "melodic-ai[bot]"
      - id: 296023097
        login: "melodic-software-github-iac[bot]"
      - id: 300690090
        login: "melodic-ci-runner-host[bot]"
      - id: 302525172
        login: "melodic-ci-runner-observer[bot]"
      - id: 337859524
        login: "melodic-release[bot]"
    field-events-since: "2026-11-07T09:45:00Z"
    options:
      "84879216": needs-triage
      "84879217": needs-reporter-info
      "84879218": needs-owner-decision
      "84879219": needs-spec
      "84879220": agent-ready
      "86380002": confirmed
      "86380003": ready
      "86380004": deferred
      "86380005": needs-human
    labels:
      needs-triage:
        - needs-triage
      needs-reporter-info:
        - needs-reporter-info
      needs-owner-decision:
        - needs-owner-decision
      needs-spec:
        - needs-spec
      agent-ready:
        - agent-ready
      confirmed:
        - "status: confirmed"
      ready:
        - "status: ready"
      deferred:
        - admission-deferred
      needs-human:
        - needs-human
    order:
      - needs-human
      - needs-owner-decision
      - needs-spec
      - needs-reporter-info
      - agent-ready
      - deferred
      - ready
      - confirmed
      - needs-triage

limits:
  fix-ci-per-run: 2
  fix-ci-restarts: 1
  fix-docs-per-run: 2
  wip-cap: 12
  turn-cap-restarts: 1
  admission-factor: 0.8
  admission-min-per-hour: 1

branch-cleanup:
  max-deletes-per-run: 25

refine-dispatch:
  activities: [fix-marker]

merge:
  rung: C2
  authority: pr-merge
  agent-identity: melodic-automation-lanes[bot]
  report-only: false
  lane-prs: gate
  require-verifier-verdict: true
  diff-check:
    denied-paths:
      - ".github/**"
      - "docs/conventions/**"
      - "plugins/source-control/skills/babysit-prs/**"
      - "plugins/source-control/scripts/**"
      - ".claude/**"
      - "plugins/*/skills/**"
      - "plugins/*/agents/**"
      - "plugins/*/hooks/**"
      - "plugins/*/.claude-plugin/**"
      - "scripts/**"
      - ".claude-plugin/**"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/REVIEW.md"
    max-changed-lines: 400
