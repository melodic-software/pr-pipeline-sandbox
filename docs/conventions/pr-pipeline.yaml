# yaml-language-server: $schema=pr-pipeline/pr-pipeline.schema.json
version: 1

activities:
  check-sandbox:
    script: scripts/lanes/check-sandbox.sh
    effect: read
    gating: gate
    reads-untrusted: false
  check-disabled:
    script: scripts/lanes/check-sandbox.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  check-token:
    script: scripts/lanes/check-token.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  # The skill activities run a model, so they apply only to PRs that touch
  # their fixtures.
  fix-marker:
    skill: sandbox-marker:fix-marker
    max-turns: 10
    effect: mutate-branch
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/refine/**"]
  explain-marker:
    skill: sandbox-marker:explain-marker
    max-turns: 5
    effect: read
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["plugins/**", ".claude/**", ".claude-plugin/**"]
  # Case 11: runs after the runner removes sudo and docker access.
  check-hardening:
    script: scripts/lanes/check-hardening.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  # Case 12: a gate skill whose verdict is sandbox/gate/verdict.txt on the head.
  review-gate:
    skill: sandbox-marker:review-gate
    max-turns: 5
    effect: read
    gating: gate
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/gate/**"]
  # Case 14: what a skill's Bash subprocess and its ancestors can see.
  audit-env:
    skill: sandbox-marker:audit-env
    max-turns: 6
    effect: read
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/env/**"]

  # Case 15: a read activity that reads untrusted text, so select-trusted-text
  # runs on the job's GITHUB_TOKEN.
  check-trusted-text:
    script: scripts/lanes/check-trusted-text.sh
    effect: read
    gating: advisory
    reads-untrusted: true
    applies-when:
      paths: ["sandbox/trusted-text/**"]

  # Case 6: no OIDC token, no GitHub token and no push in
  # pr-run-activity-read.yml.
  check-read-token:
    script: scripts/lanes/check-read-token.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  # Case 7a: a write activity that applies to every PR, sent to
  # pr-run-activity-read.yml, must stop with effect-not-read before the head
  # checkout. Its script never runs.
  check-write-effect:
    script: scripts/lanes/check-sandbox.sh
    effect: mutate-branch
    gating: advisory
    reads-untrusted: false

  # P7: the audit-env skill at a write effect, so it runs in
  # pr-run-activity-write.yml, whose job holds id-token: write.
  audit-env-write:
    skill: sandbox-marker:audit-env
    max-turns: 6
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/env/**"]

  # Phase 9: the pr-unblock lane, copied from claude-code-plugins' live config.
  resolve-conflicts:
    skill: source-control:resolve-conflicts
    args: ci
    prepare: merge-base
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      mergeable: [conflicting]
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  # Phase 3 of the address-feedback plan (claude-code-plugins#7032): the model
  # job pushes fixes and records replies; the script job posts them.
  address-feedback:
    skill: source-control:pull-request
    args: comments --ci
    prepare: review-threads
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  publish-feedback:
    script: .github/scripts/pr-unblock/publish-feedback.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  report-escalation:
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]

  # Phase 3 of the issue-work lane: copied from claude-code-plugins' config,
  # with the go-live time set to when this sandbox case was staged.
  resolve-issue:
    skill: work-items:work
    args: --ci
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
    applies-when:
      events: [labeled]
      # Sandbox only: mechanical issues too, so the lanes App labels the PRs
      # the pr-merge cases need.
      labels: ["work-class: read-only", "work-class: mechanical"]
      labeled-after: "2026-10-14T18:50:34Z"
  report-outcome:
    script: .github/scripts/work-resolve-issue/report-outcome.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [issue]

  # The pr-merge lane, copied from claude-code-plugins' config.
  merge-pr:
    script: plugins/source-control/scripts/source-control-babysit-merge
    args: --unattended --authority pr-merge --merge
    effect: merge
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]

lanes:
  pr-merge:
    stage: merge
    slots:
      - activity: merge-pr
  work-resolve-issue:
    stage: work
    slots:
      - activity: resolve-issue
      - activity: report-outcome
        needs: [resolve-issue]
  pr-unblock:
    stage: unblock
    slots:
      - activity: resolve-conflicts
      - activity: address-feedback
      - activity: publish-feedback
        needs: [address-feedback]
      - activity: report-escalation
        needs: [resolve-conflicts, address-feedback, publish-feedback]
  pr-run-checks:
    stage: verify
    slots:
      - activity: check-sandbox
      - activity: check-disabled
        enabled: false
      - activity: check-token
      - activity: check-hardening
      - activity: check-trusted-text
      - activity: check-read-token
  pr-refine:
    stage: refine
    slots:
      - activity: fix-marker
      - activity: check-write-effect
      - activity: audit-env-write
  pr-explain:
    stage: verify
    slots:
      - activity: explain-marker
  pr-review:
    stage: verify
    slots:
      - activity: review-gate
      - activity: audit-env

merge:
  # The lane auto-merges only PRs labeled `work-class: mechanical` (C2):
  # dependency bumps, lint and format fixes, syncs. The classes C1-C5 (read-only,
  # mechanical, scoped, structural, untrusted-provenance) are defined in
  # plugins/autonomy/reference/guardrails/work-classes.md.
  rung: C2
  authority: pr-merge
  agent-identity: melodic-automation-lanes[bot]
  # Sandbox only: live, so the pr-merge cases really enqueue. Main stays
  # report-only until the owner flips it.
  report-only: false
  diff-check:
    denied-paths:
      - ".github/**"
      - "docs/conventions/**"
      - "plugins/source-control/skills/babysit-prs/**"
      # The gate's wrapper, which pr-merge.yml runs under the lane token.
      - "plugins/source-control/scripts/**"
      - ".claude/**"
      - "plugins/*/skills/**"
      - "plugins/*/agents/**"
      - "plugins/*/hooks/**"
      - "plugins/*/.claude-plugin/**"
      - "scripts/**"
      # Agent instructions and the marketplace manifest the lanes load.
      - ".claude-plugin/**"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/REVIEW.md"
    max-changed-lines: 400
