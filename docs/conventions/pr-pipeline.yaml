# yaml-language-server: $schema=pr-pipeline/pr-pipeline.schema.json
version: 2

activities:
  check-sandbox:
    script: scripts/lanes/check-sandbox.sh
    effect: read
    gating: gate
    reads-untrusted: false
  check-disabled:
    script: scripts/lanes/check-sandbox.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  check-token:
    script: scripts/lanes/check-token.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  # The skill activities run a model, so they apply only to PRs that touch
  # their fixtures.
  fix-marker:
    skill: sandbox-marker:fix-marker
    effect: mutate-branch
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/refine/**"]
  explain-marker:
    skill: sandbox-marker:explain-marker
    effect: read
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["plugins/**", ".claude/**", ".claude-plugin/**"]
  # Case 11: runs after the runner removes sudo and docker access.
  check-hardening:
    script: scripts/lanes/check-hardening.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  # Case 12: a gate skill whose verdict is sandbox/gate/verdict.txt on the head.
  review-gate:
    skill: sandbox-marker:review-gate
    effect: read
    gating: gate
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/gate/**"]
  # Case 14: what a skill's Bash subprocess and its ancestors can see.
  audit-env:
    skill: sandbox-marker:audit-env
    effect: read
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/env/**"]

  # Case 15: a read activity that reads untrusted text, so select-trusted-text
  # runs on the job's GITHUB_TOKEN.
  check-trusted-text:
    script: scripts/lanes/check-trusted-text.sh
    effect: read
    gating: advisory
    reads-untrusted: true
    applies-when:
      paths: ["sandbox/trusted-text/**"]

  # Case 6: no OIDC token, no GitHub token and no push in
  # pr-run-activity-read.yml.
  check-read-token:
    script: scripts/lanes/check-read-token.sh
    effect: read
    gating: advisory
    reads-untrusted: false
  # Case 7a: a write activity that applies to every PR, sent to
  # pr-run-activity-read.yml, must stop with effect-not-read before the head
  # checkout. Its script never runs.
  check-write-effect:
    script: scripts/lanes/check-sandbox.sh
    effect: mutate-branch
    gating: advisory
    reads-untrusted: false

  # P7: the audit-env skill at a write effect, so it runs in
  # pr-run-activity-write.yml, whose job holds id-token: write.
  audit-env-write:
    skill: sandbox-marker:audit-env
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: false
    applies-when:
      paths: ["sandbox/env/**"]

  # Phase 9: the pr-unblock lane, copied from claude-code-plugins' live config.
  resolve-conflicts:
    skill: source-control:resolve-conflicts
    args: ci
    prepare: merge-base
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      mergeable: [conflicting]
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  # Phase 3 of the address-feedback plan (claude-code-plugins#7032): the model
  # job pushes fixes and records replies; the script job posts them.
  address-feedback:
    skill: source-control:pull-request
    args: comments --ci
    prepare: review-threads
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  publish-feedback:
    script: .github/scripts/pr-unblock/publish-feedback.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  # Copied from claude-code-plugins 9329c4cd64, for the synced pr-unblock-dispatch.yml.
  review-dependency:
    # Reviews one Dependabot pull request the classifier sorts `review` (a
    # major bump, an action publisher outside the allowlist, a group holding
    # a major, a red ci-status, or a file outside the content rule) and
    # returns a verdict: merge, fix, close or escalate. It posts nothing
    # itself. pr-unblock-dispatch.yml starts it; a trusted person may also
    # dispatch it by hand.
    skill: source-control:pull-request
    # The skill's CI mode for dependency bumps: reads the runner's context
    # file, the checkout and upstream release notes, runs no head code, and
    # pushes a fix only outside .github/ with [dependabot skip].
    args: dependency --ci
    # Before any model turn the runner skips a pull request Dependabot did
    # not open or one sorted `auto`, and hands it to a person once
    # `loop.dependency-review-rounds` rounds already ran.
    prepare: dependency-review
    # Reads the upstream changelog and release notes for the bumped versions.
    web-access:
      enabled: true
      domains: [github.com, raw.githubusercontent.com, www.npmjs.com, registry.npmjs.org, pypi.org]
    # Pushes a fix to the pull request's branch, nothing else.
    effect: mutate-branch
    # ci-status judges the pushed fix; the verdict job acts on the verdict.
    gating: advisory
    # Reads the PR body's release notes, the upstream changelog and head files.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  apply-dependency-verdict:
    # Acts on the verdict review-dependency recorded: posts the round marker
    # (for merge, the record the pr-merge lane merges on), closes the pull request
    # and files an ignore-entry issue (never for a security update), or hands
    # the pull request to a person. Never merges. A script, no model.
    script: .github/scripts/pr-unblock/apply-dependency-verdict.mjs
    effect: publish-artifact
    gating: advisory
    # Reads the verdict the model wrote, and the PR body for an advisory.
    reads-untrusted: true
    inputs: [pr, head-sha]
  fix-ci:
    # Fixes the failing CI checks on a lanes App pull request: reproduces each
    # with the repository's own command, fixes the cause and reruns it. It
    # holds no write token: the runner turns its uncommitted edits into a
    # patch that apply-patch pushes. pr-unblock-dispatch.yml starts it; a
    # trusted person may also dispatch it by hand.
    skill: source-control:pull-request
    # The skill's CI mode for failing checks: never weakens a check, never
    # edits .github/, and reports each check fixed or escalated.
    args: ci --ci
    # Before the run a base job writes the failing checks' names, workflow,
    # annotations and log ends to a context file, or hands the pull request
    # to a person once `loop.fix-ci-rounds` fixes were already pushed. The
    # read runner gives the skill that file, Bash, Edit and Write.
    prepare: ci-context
    # Runs head code, so no write token: the change leaves as a patch.
    effect: read
    applied-by:
      patch: apply-patch
    # ci-status judges the pushed fix.
    gating: advisory
    # Reads check annotations and logs, which print head text.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  apply-patch:
    # Applies fix-ci's patch to the head fix-ci worked on and pushes it as one
    # commit, without force. A script, no model, and it runs no head code;
    # patch-rules.json's ci-context row holds what it admits. Before the mint
    # the runner checks the patch artifact and the head, and an empty,
    # invalid or unappliable patch goes to a person.
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    # Pushes the fix to the pull request's branch, nothing else.
    effect: mutate-branch
    gating: advisory
    # Reads the patch and the report the model wrote.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  report-escalation:
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]

  # Phase 3 of the issue-work lane: copied from claude-code-plugins' config,
  # with the go-live time set to when this sandbox case was staged.
  resolve-issue:
    skill: work-items:work
    args: --ci
    # Runs model-chosen commands, so no write token: the change leaves as a
    # patch, and the run's outcome file goes to report-outcome.
    effect: read
    applied-by:
      patch: apply-issue-patch
      work-outcome: report-outcome
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
    # Sandbox only: no checks, since none of claude-code-plugins' scripts/
    # checks exist here.
    applies-when:
      events: [labeled]
      # As on claude-code-plugins: the agent-ready label alone admits the
      # issue, and a hold label starts nothing.
      labels-absent: [needs-human, needs-owner-decision, "status: needs-decision"]
      labels: [agent-ready]
      labeled-after: "2026-10-14T18:50:34Z"
  apply-issue-patch:
    # Commits resolve-issue's patch to a new branch,
    # work-resolve-issue/issue-<n>-<run id>-<attempt>, made at the commit the
    # run started from (the default branch tip it checked out, or a resumed
    # branch's tip), as one commit. A script, no model, and it runs nothing
    # from the patch; patch-rules.json's `issue` row holds what it admits.
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    # Makes the lane branch, nothing else; it never moves an existing one.
    effect: mutate-branch
    gating: advisory
    # Reads the patch and the report the model wrote.
    reads-untrusted: true
    inputs:
      - issue
    applies-when:
      # Read again right before the commit: a hold added, or agent-ready
      # removed, while the model worked drops the patch.
      labels-absent:
        - needs-human
        - needs-owner-decision
        - "status: needs-decision"
      labels:
        - agent-ready
  report-outcome:
    script: .github/scripts/work-resolve-issue/report-outcome.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [issue]

  # The pr-merge lane, copied from claude-code-plugins' config.
  merge-pr:
    script: plugins/source-control/scripts/source-control-babysit-merge
    args: --unattended --authority pr-merge --merge
    effect: merge
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]

lanes:
  pr-merge:
    stage: merge
    slots:
      - activity: merge-pr
  work-resolve-issue:
    stage: work
    slots:
      - activity: resolve-issue
      # Runs after resolve-issue, in its own job with its own token.
      - activity: apply-issue-patch
        needs:
          - resolve-issue
      - activity: report-outcome
        needs:
          - resolve-issue
          - apply-issue-patch
  pr-unblock:
    stage: unblock
    slots:
      - activity: resolve-conflicts
      - activity: address-feedback
      - activity: publish-feedback
        needs: [address-feedback]
      # Started by pr-unblock-dispatch.yml for review-tier Dependabot PRs.
      - activity: review-dependency
      # Runs after review-dependency, in its own job with its own token.
      - activity: apply-dependency-verdict
        needs: [review-dependency]
      # Started by pr-unblock-dispatch.yml for lanes App PRs whose ci-status
      # failed.
      - activity: fix-ci
      # Runs after fix-ci, in its own job with its own token.
      - activity: apply-patch
        needs: [fix-ci]
      - activity: report-escalation
        needs: [resolve-conflicts, address-feedback, publish-feedback, review-dependency, apply-dependency-verdict, fix-ci, apply-patch]
  pr-run-checks:
    stage: verify
    slots:
      - activity: check-sandbox
      - activity: check-disabled
        enabled: false
      - activity: check-token
      - activity: check-hardening
      - activity: check-trusted-text
      - activity: check-read-token
  pr-refine:
    stage: refine
    slots:
      - activity: fix-marker
      - activity: check-write-effect
      - activity: audit-env-write
  pr-explain:
    stage: verify
    slots:
      - activity: explain-marker
  pr-review:
    stage: verify
    slots:
      - activity: review-gate
      - activity: audit-env

# The version 1 activities' max-turns, as profiles (schema version 2).
models:
  profiles:
    standard: { model: default, max-turns: 75 }
    turns-10: { model: default, max-turns: 10 }
    turns-6: { model: default, max-turns: 6 }
    turns-5: { model: default, max-turns: 5 }
    # main's fix-ci profile: a worker on code at the verifier's effort, from
    # the multi-agent role map.
    code-fix:
      role: worker
      workload: code
      effort-role: verifier
      max-turns: 75
  default-profile: standard
  routes:
    fix-ci: code-fix
    fix-marker: turns-10
    explain-marker: turns-5
    review-gate: turns-5
    audit-env: turns-6
    audit-env-write: turns-6

merge:
  # The lane auto-merges only PRs labeled `work-class: mechanical` (C2):
  # dependency bumps, lint and format fixes, syncs. The classes C1-C5 (read-only,
  # mechanical, scoped, structural, untrusted-provenance) are defined in
  # plugins/autonomy/reference/guardrails/work-classes.md.
  rung: C2
  authority: pr-merge
  agent-identity: melodic-automation-lanes[bot]
  # Sandbox only: live, so the pr-merge cases really enqueue. Main stays
  # report-only until the owner flips it.
  report-only: false
  # Schema version 2 requires it at a rung above off. The sandbox's pr-merge
  # gate predates the verifier verdict and does not read it.
  require-verifier-verdict: true
  diff-check:
    denied-paths:
      - ".github/**"
      - "docs/conventions/**"
      - "plugins/source-control/skills/babysit-prs/**"
      # The gate's wrapper, which pr-merge.yml runs under the lane token.
      - "plugins/source-control/scripts/**"
      - ".claude/**"
      - "plugins/*/skills/**"
      - "plugins/*/agents/**"
      - "plugins/*/hooks/**"
      - "plugins/*/.claude-plugin/**"
      - "scripts/**"
      # Agent instructions and the marketplace manifest the lanes load.
      - ".claude-plugin/**"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/REVIEW.md"
    max-changed-lines: 400
